<title>LHC Mystery Night</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: LHC Mystery Night host screen. Dark header band with logo badge + scalloped edge, then main column (clue, lineup, answer sheet) with a standings rail. Matches the registration page. */
:root {
  --ink: #151312;
  --band: #1f1c1b;
  --panel: #1c1918;
  --panel-2: #272321;
  --line: #3a3533;
  --paper: #f3efe8;
  --muted: #a39d96;
  --red: #c8282e;
  --red-hi: #dc353b;
  --on-red: #ffffff;
  --green: #35a35c;
  --font-display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --font-body: "IBM Plex Sans", "IBM Plex Sans Arabic", "Helvetica Neue", Arial, sans-serif;
  --font-ar: "IBM Plex Sans Arabic", "Geeza Pro", "Noto Sans Arabic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
  --r-sm: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--font-body); font-size: 16px; line-height: 1.5; padding-block: 0 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1280px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .01em; line-height: .95; margin: 0; text-wrap: balance; font-weight: 900; }
.eyebrow, .mono { font-family: var(--font-body); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r-sm); padding: 10px 16px; font-weight: 600; font-size: 15px; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--red); color: var(--on-red); border-color: var(--red); }
.btn-primary:hover { background: var(--red-hi); border-color: var(--red-hi); }
.btn-danger { background: transparent; color: var(--red-hi); border-color: var(--red); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn-ghost:hover { color: var(--paper); border-color: transparent; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-lg { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .03em; font-size: 24px; line-height: 1; padding: 16px 28px; }

/* header band */
.top { position: relative; background: var(--band); padding-block: 22px 34px; }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 14px;
  background: radial-gradient(circle at 12px 14px, var(--ink) 9px, transparent 9.5px) 0 0 / 24px 14px repeat-x; }
.top-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 28px; }
.badge { flex: none; width: 116px; height: 116px; border-radius: 50%; background: #fff; border: 5px solid var(--line); overflow: hidden; display: grid; place-items: center; }
.badge img { width: 100%; height: 100%; object-fit: cover; display: block; }
.title-block { display: grid; gap: 8px; min-width: 0; flex: 1 1 320px; }
.title-block h1 { font-size: clamp(52px, 8vw, 92px); }
.title-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.pill { font-family: var(--font-mono); font-weight: 500; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; background: var(--red); color: var(--on-red); border-radius: 8px; padding: 5px 14px; }
.tagline { font-family: var(--font-ar); font-size: 20px; color: var(--paper); }
.top-side { display: grid; gap: 12px; justify-items: end; }
@media (max-width: 760px) { .top-side { justify-items: start; } .badge { width: 88px; height: 88px; border-width: 4px; } }
.steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
.steps li { min-width: 42px; height: 34px; padding: 0 10px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.steps li.done { background: var(--panel-2); color: var(--paper); }
.steps li.now { background: var(--red); color: var(--on-red); border-color: var(--red); }
.confirm-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 18px; margin-top: 22px; border: 1px solid var(--red); border-radius: var(--r); background: color-mix(in srgb, var(--red) 12%, var(--panel)); }
.confirm-bar p { margin: 0 auto 0 0; }

/* setup */
.setup { padding-top: 32px; display: grid; gap: 24px; }
.setup-head h2 { font-size: clamp(38px, 5.5vw, 60px); }
.setup-head p { max-width: 62ch; color: var(--muted); margin: 10px 0 0; font-size: 18px; }
.team-forms { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.team-form { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 20px; margin: 0; display: grid; gap: 10px; min-width: 0; }
.team-form legend { float: left; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0; margin-bottom: 4px; }
.team-form legend span { font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.field { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; font-size: 16px; }
.field::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
.field.team-name { font-weight: 600; font-size: 18px; }
.field.missing { border-color: var(--red-hi); }
.setup-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.err { color: var(--red-hi); margin: 0; }

/* play layout */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; padding-top: 30px; align-items: start; }
@media (max-width: 960px) { .play { grid-template-columns: minmax(0, 1fr); } }
.main { display: grid; gap: 30px; min-width: 0; }
.stage-head { display: grid; gap: 12px; }
.stage-head h2 { font-size: clamp(46px, 7vw, 80px); }
.rules { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--paper); }
.chip b { color: var(--red-hi); font-weight: 500; }
.clue { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 18px 20px; }
.clue label { display: block; font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.clue textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel-2); color: var(--paper); font-size: 20px; line-height: 1.5; padding: 12px 14px; }
.clue textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }

.section-title { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; margin-bottom: 14px; }
.section-title h3 { font-size: 30px; font-weight: 800; }

/* lineup */
.lineup { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .lineup { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 480px) { .lineup { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mug { position: relative; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
.mug .shot { position: relative; aspect-ratio: 4 / 4.2; max-width: 100%; display: grid; place-items: center;
  background: repeating-linear-gradient(to bottom, transparent 0 15px, color-mix(in srgb, var(--paper) 12%, transparent) 15px 16px), linear-gradient(to bottom, var(--panel-2), var(--panel)); }
.mug .shot .h { position: absolute; left: 7px; font-family: var(--font-mono); font-size: 9px; color: var(--muted); }
.mug .initials { font-family: var(--font-display); font-weight: 900; font-size: clamp(40px, 4.6vw, 62px); color: var(--paper); }
.mug .plate { padding: 9px 12px 12px; border-top: 1px solid var(--line); }
.mug .plate .no { font-family: var(--font-mono); font-size: 11px; color: var(--red-hi); letter-spacing: .08em; }
.mug .plate .nm { font-weight: 600; font-size: 14px; line-height: 1.25; }
.mug.out .shot, .mug.out .plate { filter: grayscale(1); opacity: .35; }
.mug .stampmark { position: absolute; inset: 30% 14px auto; text-align: center; text-transform: uppercase; transform: rotate(-12deg); border: 3px solid var(--red-hi); color: var(--red-hi); font-family: var(--font-display); font-weight: 900; font-size: clamp(13px, 1.35vw, 18px); letter-spacing: .03em; padding: 4px 2px 3px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 60%, transparent); line-height: 1.05; }
.mug .stampmark small { display: block; margin-top: 3px; font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .1em; }
.mug.fresh .stampmark { animation: thump .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes thump { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .mug.fresh .stampmark { animation: none; } }

/* answer sheet */
.sheet { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.row .who { min-width: 0; }
.row .tname { font-weight: 700; font-size: 19px; }
.row .members { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .act { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.row select { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; max-width: 100%; }
.row.locked { border-color: color-mix(in srgb, var(--red) 55%, var(--line)); }
.order { font-family: var(--font-mono); font-size: 13px; background: var(--red); color: var(--on-red); border-radius: 6px; padding: 3px 8px; font-weight: 500; }
.pick { font-weight: 600; }
.time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.right { border-color: color-mix(in srgb, var(--green) 60%, var(--line)); }
.row.wrong { border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
.verdict { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
.verdict.ok { background: color-mix(in srgb, var(--green) 20%, transparent); color: var(--green); }
.verdict.no { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red-hi); }
.pts { font-family: var(--font-display); font-weight: 900; font-size: 32px; min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
.pts.zero { color: var(--muted); }
@media (max-width: 640px) { .row { grid-template-columns: minmax(0, 1fr); } .row .act { justify-content: flex-start; } }

.actionbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 18px; border: 1px dashed var(--line); border-radius: var(--r); }
.actionbar .status { margin-right: auto; color: var(--muted); }
.reveal-card { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; padding: 20px 22px; border-radius: var(--r); background: var(--band); border: 1px solid var(--line); }
.reveal-card .ans { margin-right: auto; }
.reveal-card .ans strong { display: block; font-family: var(--font-display); font-size: 40px; font-weight: 900; text-transform: uppercase; line-height: 1; color: var(--paper); margin-top: 4px; }

/* standings */
.board { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 18px; display: grid; gap: 12px; }
@media (max-width: 960px) { .board { position: static; } }
.board h3 { font-size: 28px; font-weight: 800; }
.stand { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.stand li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: var(--r-sm); background: var(--panel-2); border: 1px solid transparent; }
.stand li.lead { border-color: var(--red); }
.stand .rk { font-family: var(--font-mono); color: var(--muted); font-size: 13px; }
.stand .lead .rk { color: var(--red-hi); }
.stand .nm { font-weight: 600; overflow-wrap: anywhere; }
.stand .dots { display: flex; gap: 3px; margin-top: 4px; }
.stand .dots span { min-width: 22px; height: 18px; padding: 0 3px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 10px; border-radius: 4px; background: var(--ink); color: var(--muted); font-variant-numeric: tabular-nums; }
.stand .dots span.got { background: color-mix(in srgb, var(--green) 24%, transparent); color: var(--paper); }
.stand .tot { font-family: var(--font-display); font-weight: 900; font-size: 30px; font-variant-numeric: tabular-nums; }

/* final */
.final { padding-top: 32px; display: grid; gap: 28px; }
.final-head h2 { font-size: clamp(50px, 8vw, 96px); }
.final-head p { color: var(--muted); margin: 8px 0 0; font-size: 18px; }
.podium { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.pod { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 20px; display: grid; gap: 6px; }
.pod.first { border-color: var(--red); background: color-mix(in srgb, var(--red) 10%, var(--panel)); }
.pod .place { font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--red-hi); }
.pod .nm { font-family: var(--font-display); font-weight: 900; font-size: 38px; text-transform: uppercase; line-height: 1; }
.pod .members { color: var(--muted); font-size: 13px; }
.pod .score { font-family: var(--font-display); font-weight: 900; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; }
.pod .score small { font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 560px; }
th, td { padding: 11px 16px; text-align: left; border-bottom: 1px solid var(--line); }
th { font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); background: var(--panel); }
td.n, th.n { text-align: right; }
td.total { font-family: var(--font-display); font-weight: 900; font-size: 24px; }
tr:last-child td { border-bottom: 0; }
.remaining { display: flex; gap: 16px; align-items: center; padding: 16px 20px; border: 1px solid var(--red); border-radius: var(--r); background: var(--panel); }
.remaining .initials { font-family: var(--font-display); font-weight: 900; font-size: 48px; color: var(--red-hi); }
.remaining strong { display: block; font-size: 22px; }
.final-actions { display: flex; flex-wrap: wrap; gap: 12px; }
</style>

sT3SJIxEjso+VSpB2nnJ6cUAejftTX9h4Y+FF54yudIj1W88M3NvdWdvNcSwxmSSVICW8tgSNsrHB4yBXovw40LTfDXgbQdN0m1a10+O1R44WmeUpvG8je5LHlj1NeIX/7E/g3VLSS0v/Ffji6tZMb4Z9YLo+CCMqVweQD+FTp+xp4XjRUTxn4+VFAUKNbcAAdulAHtvj93j8DeJnjZlddNuiGUkEHyXwQR0r43+FWrahNd/snGS/vH+2Q6v9o3zufOwkpG/J+bGOM9K9bk/Y08LSxvHJ4z8fPG6lWVtbYhgRggjHQjiu28Pfs9eF/Dcnw8e0uNSY+BFuV00STKd4nDB/M+X5vvnGMUAdfo3xB0LXPGfiHwlZzytrfh9IHvYmhZVQTLuTDHhsgdq+dNP/aw8Va94y8KjT/COmweBfEXiRvD9rqFxds11LscK8gjXAXg5Gc+la3xi+HWseDviYPiN4T+Ic3hi+8Ttb6TeWsukPqENzKF2xEqgOwYXlm4B7/MRUXwL+BXh/Wvhr4KubnXrzVP7B1y61myu7e1ksfMmZ8EPFKu8AFT6Z7cUAei6/8AFjX/AAn8ZdA8Jav4bg/4RTxOzW+l6zDc5kFwkW90ki7DOQCMduvNYX7It3cXvwv1KS5nmnkHiDUkDSyM5CiYgDJJ4ApfDf7J3hbw34u0XxMviHxZf6ho9wbm2TUNSM8Qcgg/KR0we1ZQ/Yw8HxTXUlr4o8aWaXM8lw8VrqxijDuxZiFUYHJoA+kD0/GvEf2bNdttdtPiQbbR7fTPsfi++tpBBNLILh1WImU+Yx2k5HyrhRjgVgf8Mb+Gf+h18f8A/g8f/CvTfhF8INE+DOhaho+h3Wo3MF/fPqE0uoTebI0rIik7sDsg6980Aeg0UUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFIRmlooATFLRRQAUUUUAFBGaKKAEAwaWiigAooooADyKQDFLRQAUUUUAFFFFACEZoAxS0UAFFFFABRRRQAUUUUAFFFFABRRRQB//2Q==";

  const uid = () => Math.random().toString(36).slice(2, 9);
  const blankTeam = () => ({ id: uid(), name: "", members: ["", "", "", ""] });
  const fresh = () => ({
    phase: "setup",
    teams: [blankTeam(), blankTeam(), blankTeam()],
    stage: 0,
    subs: [[], [], [], [], []],      // per stage: [{teamId, suspect, t}] in lock-in order
    revealed: [false, false, false, false, false],
    clues: ["", "", "", "", ""],
    picks: {}                         // unsaved dropdown choice per team for the current stage
  });

  let state;
  let ui = { confirmReset: false, confirmReveal: false, setupErr: "", justStamped: -1 };

  function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.teams ? s : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const initials = n => {
    const w = n.split(/\s+/), caps = (w[w.length - 1].match(/[A-Z]/g) || []).join("");
    return (caps.length >= 2 ? caps : w[0][0] + caps).slice(0, 2).toUpperCase();
  };
  const teamName = (t, i) => (t.name || "").trim() || "Team " + (i + 1);
  const teamIdx = id => state.teams.findIndex(t => t.id === id);
  const fmtTime = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  // ---- scoring ----
  function stagePoints(s) {
    const out = {};
    state.teams.forEach(t => out[t.id] = 0);
    if (!state.revealed[s]) return out;
    let k = 0;
    state.subs[s].forEach(sub => {
      if (sub.suspect === STAGES[s].answer) {
        out[sub.teamId] = STAGES[s].ranked[k] ?? STAGES[s].rest;
        k++;
      }
    });
    return out;
  }
  function standings() {
    const per = STAGES.map((_, s) => stagePoints(s));
    const rows = state.teams.map((t, i) => {
      const pts = per.map(p => p[t.id]);
      return { t, i, pts, total: pts.reduce((a, b) => a + b, 0) };
    });
    rows.sort((a, b) => b.total - a.total || a.i - b.i);
    rows.forEach((r, j) => { r.rank = j > 0 && rows[j - 1].total === r.total ? rows[j - 1].rank : j + 1; });
    return rows;
  }
  const eliminatedBefore = s => STAGES.slice(0, s).map(x => x.answer);
  const eliminatedNow = () => STAGES.map((x, s) => state.revealed[s] ? x.answer : null).filter(Boolean);

  // ---- render ----
  const app = document.getElementById("app");

  function header() {
    const steps = STAGES.map((_, s) => {
      let cls = "";
      if (state.phase === "play" && s === state.stage) cls = "now";
      else if (state.revealed[s]) cls = "done";
      return `<li class="${cls}" title="Stage ${s + 1}">${state.revealed[s] && !(state.phase === "play" && s === state.stage) ? "✓ " : ""}${s + 1}</li>`;
    }).join("");
    const resetBar = ui.confirmReset ? `
      <div class="confirm-bar" role="alert">
        <p>Start over? Scores for all five stages will be cleared.</p>
        <button class="btn" data-act="restart-same">Keep the teams</button>
        <button class="btn btn-danger" data-act="restart-all">Clear everything</button>
        <button class="btn btn-ghost" data-act="cancel-reset">Cancel</button>
      </div>` : "";
    const pill = state.phase === "setup" ? "Team registration" : state.phase === "final" ? "Case closed" : `Stage ${state.stage + 1} of 5`;
    return `
      <header class="top gutter"><div class="wrap">
        <div class="top-inner">
          <div class="badge"><img src="${LOGO}" alt="Lebanese Heritage Club"></div>
          <div class="title-block">
            <span class="eyebrow" style="color:var(--paper)">Lebanese Heritage Club · AUB</span>
            <h1>Mystery Night</h1>
            <div class="title-meta"><span class="pill">${pill}</span><span class="tagline" lang="ar" dir="rtl">حلّ اللغز، اضحك، وجرّب حظك بالقرعة</span></div>
          </div>
          ${state.phase !== "setup" ? `<div class="top-side"><ol class="steps" aria-label="Stages">${steps}</ol><button class="btn btn-ghost" data-act="ask-reset">New game</button></div>` : ""}
        </div>
        ${resetBar}
      </div></header>`;
  }

  function renderSetup() {
    const forms = state.teams.map((t, i) => `
      <fieldset class="team-form">
        <legend><span>Team ${i + 1}</span>${state.teams.length > 1 ? `<button class="btn btn-ghost" data-act="remove-team" data-id="${t.id}" aria-label="Remove team ${i + 1}">Remove</button>` : ""}</legend>
        <input class="field team-name" id="tn-${t.id}" data-team="${t.id}" data-k="name" placeholder="Team name (optional)" value="${esc(t.name)}" autocomplete="off">
        ${t.members.map((m, j) => `<input class="field${ui.setupErr && !m.trim() ? " missing" : ""}" id="tm-${t.id}-${j}" data-team="${t.id}" data-k="m${j}" placeholder="Member ${j + 1}" value="${esc(m)}" autocomplete="off">`).join("")}
      </fieldset>`).join("");
    return `
      <section class="setup">
        <div class="setup-head">
          <p class="eyebrow">Five clues · six suspects · one stage at a time</p>
          <h2>Register the investigators</h2>
          <p>Each team has four members. Add as many teams as you need, then open the case. Answers are locked in on this screen in the order teams give them, and that order decides who gets the top points.</p>
        </div>
        <div class="team-forms">${forms}</div>
        <div class="setup-actions">
          <button class="btn" data-act="add-team">+ Add team</button>
          <button class="btn btn-primary btn-lg" data-act="start">Open the case</button>
          ${ui.setupErr ? `<p class="err" role="alert">${esc(ui.setupErr)}</p>` : ""}
        </div>
      </section>`;
  }

  function lineup(s, showStage) {
    const out = {};
    STAGES.forEach((x, k) => { if (state.revealed[k] && (showStage === undefined || k <= showStage)) out[x.answer] = k; });
    return `<div class="lineup">${SUSPECTS.map((n, i) => {
      const k = out[n];
      const isOut = k !== undefined;
      return `<div class="mug${isOut ? " out" : ""}${isOut && ui.justStamped === k ? " fresh" : ""}">
        <div class="shot"><span class="h" style="top:8px">6'</span><span class="h" style="top:50%">5'</span><span class="initials" aria-hidden="true">${initials(n)}</span></div>
        <div class="plate"><div class="no">No. ${String(i + 1).padStart(2, "0")}</div><div class="nm">${esc(n)}</div></div>
        ${isOut ? `<div class="stampmark">Eliminated<small>Stage ${k + 1}</small></div>` : ""}
      </div>`;
    }).join("")}</div>`;
  }

  function renderPlay() {
    const s = state.stage;
    const st = STAGES[s];
    const revealed = state.revealed[s];
    const subs = state.subs[s];
    const pts = stagePoints(s);
    const options = SUSPECTS.filter(n => !eliminatedBefore(s).includes(n));

    const rows = state.teams.map((t, i) => {
      const subIdx = subs.findIndex(x => x.teamId === t.id);
      const sub = subs[subIdx];
      const who = `<div class="who"><div class="tname">${esc(teamName(t, i))}</div><div class="members">${t.members.map(esc).join(" · ")}</div></div>`;
      if (revealed) {
        const right = sub && sub.suspect === st.answer;
        return `<div class="row ${right ? "right" : "wrong"}">${who}<div class="act">
          ${sub ? `<span class="order">#${subIdx + 1}</span><span class="pick">${esc(sub.suspect)}</span>` : `<span class="time">No answer</span>`}
          <span class="verdict ${right ? "ok" : "no"}">${right ? "Correct" : sub ? "Wrong" : "Missed"}</span>
          <span class="pts${pts[t.id] ? "" : " zero"}">+${pts[t.id]}</span></div></div>`;
      }
      if (sub) {
        return `<div class="row locked">${who}<div class="act">
          <span class="order">#${subIdx + 1}</span><span class="pick">${esc(sub.suspect)}</span><span class="time">${fmtTime(sub.t)}</span>
          <button class="btn btn-ghost" data-act="undo-sub" data-id="${t.id}">Undo</button></div></div>`;
      }
      const cur = state.picks[t.id] || "";
      return `<div class="row">${who}<div class="act">
        <select id="sel-${t.id}" data-pick="${t.id}" aria-label="Suspect for ${esc(teamName(t, i))}">
          <option value="">Choose a suspect…</option>
          ${options.map(n => `<option${n === cur ? " selected" : ""}>${esc(n)}</option>`).join("")}
        </select>
        <button class="btn btn-primary" data-act="lock" data-id="${t.id}"${cur ? "" : " disabled"}>Lock in</button></div></div>`;
    }).join("");

    let action;
    if (!revealed) {
      const missing = state.teams.length - subs.length;
      action = ui.confirmReveal ? `
        <div class="confirm-bar" role="alert" style="margin:0">
          <p>${missing} team${missing === 1 ? " hasn't" : "s haven't"} locked in. They score 0 for this stage.</p>
          <button class="btn btn-primary" data-act="reveal-now">Reveal anyway</button>
          <button class="btn btn-ghost" data-act="cancel-reveal">Keep waiting</button>
        </div>` : `
        <div class="actionbar">
          <span class="status">${subs.length} of ${state.teams.length} teams locked in</span>
          <button class="btn btn-primary btn-lg" data-act="reveal"${subs.length ? "" : " disabled"}>Reveal the answer</button>
        </div>`;
    } else {
      action = `
        <div class="reveal-card">
          <div class="ans"><span class="eyebrow">Eliminated this stage</span><strong>${esc(st.answer)}</strong></div>
          <button class="btn btn-ghost" data-act="unreveal">Undo reveal</button>
          <button class="btn btn-primary btn-lg" data-act="next">${s < 4 ? `Go to stage ${s + 2}` : "Final standings"}</button>
        </div>`;
    }

    return `
      <div class="play">
        <div class="main">
          <div class="stage-head">
            ${s === 4 ? `<span class="eyebrow">Final clue · biggest points</span>` : ""}
            <h2>Clue ${s + 1}</h2>
            <div class="rules"><span class="chip">${st.rule}</span><span class="chip">Wrong answer <b>0</b></span></div>
          </div>
          <div class="clue">
            <label for="clue-${s}">Clue ${s + 1} · evidence note</label>
            <textarea id="clue-${s}" data-clue="${s}" placeholder="Type or paste the clue here to show it on screen (optional)">${esc(state.clues[s])}</textarea>
          </div>
          <section>
            <div class="section-title"><h3>The suspects</h3><span class="mono">${SUSPECTS.length - eliminatedNow().length} still in play</span></div>
            ${lineup(s)}
          </section>
          <section>
            <div class="section-title"><h3>Who do they eliminate?</h3><span class="mono">Order of lock-in = order of time</span></div>
            <div class="sheet">${rows}</div>
          </section>
          ${action}
        </div>
        ${board()}
      </div>`;
  }

  function board() {
    const rows = standings();
    const top = rows.length && rows[0].total > 0 ? rows[0].total : -1;
    return `<aside class="board" aria-label="Standings">
      <div class="section-title" style="margin:0"><h3>Standings</h3><span class="mono">Total</span></div>
      <ol class="stand">${rows.map(r => `
        <li class="${r.total === top ? "lead" : ""}">
          <span class="rk">${r.rank}</span>
          <div style="min-width:0"><div class="nm">${esc(teamName(r.t, r.i))}</div>
            <div class="dots">${r.pts.map((p, k) => `<span class="${state.revealed[k] && p ? "got" : ""}" title="Stage ${k + 1}">${state.revealed[k] ? p : "–"}</span>`).join("")}</div></div>
          <span class="tot">${r.total}</span>
        </li>`).join("")}</ol>
    </aside>`;
  }

  function renderFinal() {
    const rows = standings();
    const places = ["First place", "Second place", "Third place"];
    const podium = rows.filter(r => r.rank <= 3).map(r => `
      <div class="pod${r.rank === 1 ? " first" : ""}">
        <span class="place">${places[r.rank - 1]}</span>
        <span class="nm">${esc(teamName(r.t, r.i))}</span>
        <span class="members">${r.t.members.map(esc).join(" · ")}</span>
        <span class="score">${r.total} <small>points</small></span>
      </div>`).join("");
    const left = SUSPECTS.filter(n => !eliminatedNow().includes(n));
    return `
      <section class="final">
        <div class="final-head">
          <p class="eyebrow">All five clues played</p>
          <h2>Case closed</h2>
          <p>Final standings across all five stages.</p>
        </div>
        <div class="podium">${podium}</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Rank</th><th>Team</th>${STAGES.map((_, k) => `<th class="n">S${k + 1}</th>`).join("")}<th class="n">Total</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td>${r.rank}</td><td><strong>${esc(teamName(r.t, r.i))}</strong></td>${r.pts.map(p => `<td class="n">${p}</td>`).join("")}<td class="n total">${r.total}</td></tr>`).join("")}</tbody>
        </table></div>
        ${left.length === 1 ? `<div class="remaining"><span class="initials">${initials(left[0])}</span><div><span class="eyebrow">Last suspect standing</span><strong>${esc(left[0])}</strong></div></div>` : ""}
        ${lineup(4)}
        <div class="final-actions">
          <button class="btn" data-act="back-to-5">Back to stage 5</button>
          <button class="btn btn-ghost" data-act="ask-reset">New game</button>
        </div>
      </section>`;
  }

  function render() {
    const body = state.phase === "setup" ? renderSetup() : state.phase === "final" ? renderFinal() : renderPlay();
    app.innerHTML = header() + `<div class="gutter"><div class="wrap">${body}</div></div>`;
    ui.justStamped = -1;
  }

  // ---- actions ----
  function commit() { save(); render(); }

  app.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const id = b.dataset.id;
    const s = state.stage;
    switch (b.dataset.act) {
      case "add-team": state.teams.push(blankTeam()); ui.setupErr = ""; commit();
        setTimeout(() => { const f = document.getElementById("tn-" + state.teams[state.teams.length - 1].id); f && f.focus(); }); break;
      case "remove-team": state.teams = state.teams.filter(t => t.id !== id); commit(); break;
      case "start": {
        const bad = state.teams.filter(t => t.members.some(m => !m.trim()));
        if (bad.length) { ui.setupErr = `Every team needs four member names. ${bad.length} team${bad.length === 1 ? " is" : "s are"} missing some.`; render(); return; }
        ui.setupErr = "";
        state.phase = "play"; state.stage = 0; commit(); window.scrollTo(0, 0); break;
      }
      case "lock": {
        const pick = state.picks[id];
        if (!pick || state.subs[s].some(x => x.teamId === id)) return;
        state.subs[s].push({ teamId: id, suspect: pick, t: Date.now() });
        delete state.picks[id];
        commit(); break;
      }
      case "undo-sub": state.subs[s] = state.subs[s].filter(x => x.teamId !== id); commit(); break;
      case "reveal":
        if (state.subs[s].length < state.teams.length) { ui.confirmReveal = true; render(); return; }
      // fall through
      case "reveal-now": state.revealed[s] = true; ui.confirmReveal = false; ui.justStamped = s; commit(); break;
      case "cancel-reveal": ui.confirmReveal = false; render(); break;
      case "unreveal": state.revealed[s] = false; commit(); break;
      case "next":
        state.picks = {};
        if (s < 4) state.stage = s + 1; else state.phase = "final";
        commit(); window.scrollTo(0, 0); break;
      case "back-to-5": state.phase = "play"; state.stage = 4; commit(); break;
      case "ask-reset": ui.confirmReset = true; render(); window.scrollTo(0, 0); break;
      case "cancel-reset": ui.confirmReset = false; render(); break;
      case "restart-same": {
        const teams = state.teams, clues = state.clues;
        state = fresh(); state.teams = teams; state.clues = clues; state.phase = "play";
        ui.confirmReset = false; commit(); break;
      }
      case "restart-all": state = fresh(); ui.confirmReset = false; commit(); break;
    }
  });

  app.addEventListener("input", e => {
    const el = e.target;
    if (el.dataset.team) {
      const t = state.teams.find(x => x.id === el.dataset.team);
      if (!t) return;
      if (el.dataset.k === "name") t.name = el.value;
      else t.members[+el.dataset.k.slice(1)] = el.value;
      if (el.value.trim()) el.classList.remove("missing");
      save();
    } else if (el.dataset.clue !== undefined) {
      state.clues[+el.dataset.clue] = el.value; save();
    }
  });

  app.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset.pick) {
      state.picks[el.dataset.pick] = el.value;
      save();
      const btn = el.parentElement.querySelector('[data-act="lock"]');
      if (btn) btn.disabled = !el.value;
    }
  });

  // ---- boot ----
  function start(data) {
    state = (data && data.state) || load() || fresh();
    render();
  }
  window.claude?.hot?.snapshot?.(() => ({ state }));
  if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
