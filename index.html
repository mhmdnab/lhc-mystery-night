<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a0b">
<title>LHC Mystery Night</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top gutter">
  <div class="wrap top-inner">
    <div class="badge"><img src="logo.jpg" alt="Lebanese Heritage Club"></div>
    <div class="title-block">
      <span class="eyebrow">Lebanese Heritage Club · AUB</span>
      <h1><span class="r">Mystery</span> <span class="g">Night</span></h1>
      <div class="title-meta"><span class="pill" id="pill">Opening the case…</span><span class="tagline" lang="ar" dir="rtl">حلّ اللغز، اضحك، وجرّب حظك بالقرعة</span></div>
    </div>
  </div>
</header>

<main class="gutter">
  <div class="narrow" id="app" style="padding-top:26px"></div>
</main>
<div class="dome" aria-hidden="true"></div>

<script src="config.js"></script>
<script>
(function () {
  const { SUPABASE_URL, SUPABASE_KEY } = window.MN_CONFIG;
  const TOKEN_KEY = "lhc-mn-team-token";
  const POLL_MS = 3000;
  const ORD = n => { const t = ["th","st","nd","rd"], v = n % 100; return n + (t[(v - 20) % 10] || t[v] || t[0]); };

  let token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  let state = null;          // last server state
  let lastJson = "";
  let ui = { selected: null, confirming: false, busy: false, err: "", netErr: false };
  let draft = { name: "", members: ["", "", "", ""] };

  const app = document.getElementById("app");
  const pill = document.getElementById("pill");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function rpc(fn, args) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(args)
    });
    let data = null; try { data = await r.json(); } catch (e) {}
    if (!r.ok) { const e = new Error((data && data.message) || "Something went wrong. Try again."); e.server = true; throw e; }
    return data;
  }

  const SIL = '<svg class="sil" viewBox="0 0 100 100" aria-hidden="true"><path class="body" d="M50 14a19 19 0 1 1 0 38a19 19 0 1 1 0-38zM10 100c0-28 17-42 40-42s40 14 40 42z"/><text x="50" y="44" text-anchor="middle" font-size="26">?</text></svg>';

  function lineup({ interactive }) {
    const picks = {};
    (state.picks || []).forEach(p => picks[p.suspect] = p.stage);
    return `<div class="lineup">${state.suspects.map((n, i) => {
      const out = picks[n] !== undefined;
      const sel = ui.selected === n;
      const tag = interactive && !out ? "button" : "div";
      return `<${tag} class="mug${out ? " out" : ""}${sel ? " sel" : ""}"${tag === "button" ? ` type="button" data-pick="${esc(n)}" aria-pressed="${sel}"` : ""}>
        <div class="shot"><span class="h" style="top:8px">6'</span><span class="h" style="top:50%">5'</span>${SIL}</div>
        <div class="plate"><div class="no">${sel ? "Selected" : "No. " + String(i + 1).padStart(2, "0")}</div><div class="nm">${esc(n)}</div></div>
        ${out ? `<div class="stampmark">You eliminated<small>Stage ${picks[n]}</small></div>` : ""}
      </${tag}>`;
    }).join("")}</div>`;
  }

  function viewRegister() {
    if (state.status === "finished") {
      return `<div class="status-card"><span class="eyebrow">Case closed</span><h2>The game has ended</h2><p class="note">Registration is closed.</p></div>`;
    }
    return `
      <div class="stack">
        <div><h2 style="font-size:clamp(36px,7vw,56px)">Register your team</h2>
          <p class="lede">One phone per team. Enter your team name and all four investigators, then keep this page open for the whole game.</p></div>
        <form class="panel stack" id="reg" novalidate>
          <div><label class="label" for="f-name">Team name</label>
            <input class="field" id="f-name" maxlength="40" autocomplete="off" placeholder="e.g. The Fez Detectives" value="${esc(draft.name)}"></div>
          ${draft.members.map((m, j) => `<div><label class="label" for="f-m${j}">Member ${j + 1}</label>
            <input class="field" id="f-m${j}" data-m="${j}" maxlength="60" autocomplete="off" placeholder="Full name" value="${esc(m)}"></div>`).join("")}
          ${ui.err ? `<p class="err" role="alert">${esc(ui.err)}</p>` : ""}
          <button class="btn btn-primary btn-lg btn-block" type="submit"${ui.busy ? " disabled" : ""}>${ui.busy ? "Registering…" : "Register our team"}</button>
          <p class="note">One registration per team. The club uses your names only for this event.</p>
        </form>
      </div>`;
  }

  function teamHead() {
    return `<div style="display:grid;gap:4px;margin-bottom:18px"><span class="eyebrow">Your team</span>
      <div style="font-family:var(--font-display);font-weight:900;font-size:34px;text-transform:uppercase;line-height:1">${esc(state.team.name)}</div>
      <div class="members">${state.team.members.map(esc).join(" · ")}</div></div>`;
  }

  function viewLobby() {
    return `${teamHead()}
      <div class="status-card panel-gold"><span class="eyebrow">You're registered</span>
        <div class="big">The case opens soon</div>
        <span class="pulse">Waiting for the host to open the first clue</span></div>
      <h3 style="font-size:28px;margin:30px 0 14px">The suspects</h3>
      ${lineup({ interactive: false })}`;
  }

  function viewStage() {
    const s = state.stage;
    const mine = (state.picks || []).find(p => p.stage === s);
    if (mine) {
      return `${teamHead()}
        <div class="status-card panel-gold"><span class="eyebrow">Clue ${s} · locked in</span>
          <div class="big">You eliminated ${esc(mine.suspect)}</div>
          <span class="note">${s < 5 ? "Wait for the next clue." : "That was the final clue. Wait for the host to close the case."}</span></div>
        <h3 style="font-size:28px;margin:30px 0 14px">The suspects</h3>
        ${lineup({ interactive: false })}`;
    }
    const sel = ui.selected;
    const bar = ui.confirming && sel ? `
      <div class="confirm" role="alertdialog" aria-label="Confirm">
        <p>Eliminate <strong>${esc(sel)}</strong>? You can't change it after this.</p>
        ${ui.err ? `<p class="err" role="alert">${esc(ui.err)}</p>` : ""}
        <div class="row2"><button class="btn" type="button" data-act="back">Go back</button>
        <button class="btn btn-primary" type="button" data-act="submit"${ui.busy ? " disabled" : ""}>${ui.busy ? "Sending…" : "Yes, eliminate"}</button></div>
      </div>` : `
      <button class="btn btn-primary btn-lg btn-block" type="button" data-act="confirm"${sel ? "" : " disabled"}>${sel ? "Eliminate " + esc(sel) : "Tap a suspect"}</button>`;
    return `${teamHead()}
      <div style="display:grid;gap:8px;margin-bottom:18px"><span class="eyebrow">Stage ${s} of 5${s === 5 ? " · Final clue" : ""}</span>
        <h2 style="font-size:clamp(48px,10vw,76px)">Clue ${s}</h2>
        <p class="lede" style="margin:0">Read the clue with your team, then choose the suspect you eliminate. Answer once.</p></div>
      ${lineup({ interactive: true })}
      <div class="actionbar">${bar}</div>`;
  }

  function viewFinished() {
    const r = state.rank, n = state.teams;
    if (!r) return `${teamHead()}<div class="status-card"><span class="eyebrow">Case closed</span><div class="big">The game has ended</div></div>`;
    if (r === 1) {
      return `${teamHead()}
        <div class="status-card red-card" style="padding:28px"><span class="eyebrow">Case closed</span>
          <h2 style="font-size:clamp(52px,12vw,96px)">You came 1st</h2>
          <span class="note">Your team cracked the case first. Congratulations, detectives.</span></div>`;
    }
    return `${teamHead()}
      <div class="status-card panel-gold" style="padding:28px"><span class="eyebrow">Case closed</span>
        <h2 style="font-size:clamp(52px,12vw,96px)">You finished ${ORD(r)}</h2>
        <span class="note">Out of ${n} teams. Thanks for playing.</span></div>`;
  }

  function render() {
    if (!state) {
      app.innerHTML = ui.netErr
        ? `<div class="banner">Can't reach the game. Check your connection; this page retries on its own.</div>`
        : `<p class="pulse">Opening the case file…</p>`;
      return;
    }
    pill.textContent = !state.team ? (state.status === "finished" ? "Case closed" : "Team registration")
      : state.status === "lobby" ? "Waiting to start"
      : state.status === "finished" ? "Case closed"
      : `Stage ${state.stage} of 5`;
    let html = !state.team ? viewRegister() : state.status === "lobby" ? viewLobby() : state.status === "finished" ? viewFinished() : viewStage();
    if (ui.netErr) html = `<div class="banner" style="margin-bottom:14px">Connection lost. Retrying…</div>` + html;
    app.innerHTML = html;
  }

  async function refresh() {
    try {
      const s = await rpc("team_state", { p_token: token || "00000000-0000-0000-0000-000000000000" });
      const j = JSON.stringify(s);
      const wasNet = ui.netErr; ui.netErr = false;
      if (j !== lastJson || wasNet) {
        const prev = state;
        state = s; lastJson = j;
        // stage changed or answer recorded: clear selection
        if (!prev || prev.stage !== s.stage || prev.status !== s.status || (prev.picks || []).length !== (s.picks || []).length) {
          ui.selected = null; ui.confirming = false; ui.err = "";
        }
        // don't wipe a half-typed registration form
        if (!(prev && !prev.team && !s.team && s.status !== "finished" && document.getElementById("reg"))) render();
      }
    } catch (e) {
      if (!ui.netErr) { ui.netErr = true; render(); }
    }
  }

  app.addEventListener("input", e => {
    const el = e.target;
    if (el.id === "f-name") draft.name = el.value;
    else if (el.dataset.m !== undefined) draft.members[+el.dataset.m] = el.value;
  });

  app.addEventListener("submit", async e => {
    if (e.target.id !== "reg") return;
    e.preventDefault();
    if (ui.busy) return;
    if (!draft.name.trim()) { ui.err = "Enter a team name."; render(); return; }
    if (draft.members.some(m => !m.trim())) { ui.err = "Enter all four member names."; render(); return; }
    ui.busy = true; ui.err = ""; render();
    try {
      const res = await rpc("register_team", { p_name: draft.name, p_members: draft.members });
      token = res.token;
      try { localStorage.setItem(TOKEN_KEY, token); } catch (err) {}
      ui.busy = false; lastJson = "";
      await refresh();
    } catch (err) {
      ui.busy = false; ui.err = err.server ? err.message : "Couldn't reach the game. Check your connection and try again."; render();
    }
  });

  app.addEventListener("click", async e => {
    const mug = e.target.closest("[data-pick]");
    if (mug) { ui.selected = mug.dataset.pick; ui.confirming = false; ui.err = ""; render(); return; }
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    if (b.dataset.act === "confirm") { ui.confirming = true; render(); }
    else if (b.dataset.act === "back") { ui.confirming = false; ui.err = ""; render(); }
    else if (b.dataset.act === "submit") {
      ui.busy = true; ui.err = ""; render();
      try {
        await rpc("submit_answer", { p_token: token, p_stage: state.stage, p_suspect: ui.selected });
        ui.busy = false; lastJson = "";
        await refresh();
      } catch (err) {
        ui.busy = false;
        ui.err = err.server ? err.message : "Couldn't send. Check your connection and try again.";
        lastJson = ""; render(); refresh();
      }
    }
  });

  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  render();
  refresh();
  setInterval(() => { if (!document.hidden && !ui.busy) refresh(); }, POLL_MS);
})();
</script>
</body>
</html>
